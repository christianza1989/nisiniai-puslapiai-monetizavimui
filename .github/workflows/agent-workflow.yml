name: Agent workflow
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Multi-PC freshness and bootstrap regression
        run: node --test scripts/git-freshness.test.mjs scripts/install-agent-git-bootstrap.test.mjs
      - name: Calibration Git inputs
        run: node SKILLS/business-agent-calibration/scripts/check-inputs.mjs
      - name: Core upgrade and quarantine regression
        run: node --test scripts/core-upgrade.test.mjs scripts/core-upgrade-check.test.mjs
      - name: Shared change experience and check coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/core-upgrade-check.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
  acquisition-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: acqadmin
          POSTGRES_DB: acquisition_capture
          # Disposable CI service only. Tests assert actual role/RLS/SQL privileges;
          # this service does not certify production credential authentication.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 15439:5432
        options: >-
          --health-cmd "pg_isready -U acqadmin -d acquisition_capture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: agent-business-core/runtime
    env:
      PINET_ACQ_TEST_CONFIG: ${{ github.workspace }}/tmp/acquisition-ci/test-config.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Locked Python runtime and disposable DB binding
        run: |
          python -m pip install uv==0.12.21
          uv python install 3.13.15
          python - <<'PY'
          import json, os, secrets
          from pathlib import Path
          target = Path(os.environ['PINET_ACQ_TEST_CONFIG'])
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps({
            'fixture_only': True,
            'database_url': 'postgresql+asyncpg://pinet_runtime:' + secrets.token_hex(32) + '@127.0.0.1:15439/acquisition_capture',
            'admin_database_url': 'postgresql+asyncpg://acqadmin:' + secrets.token_hex(32) + '@127.0.0.1:15439/acquisition_capture'
          }), encoding='utf-8')
          PY
      - name: Actual PostgreSQL authenticated HTTP ledger and offline regressions
        run: |
          uv run --locked --python 3.13.15 python scripts/acquisition_capture_setup.py
          uv run --locked --python 3.13.15 pytest acceptance_tests/test_acquisition_ledger.py acceptance_tests/test_acquisition_projection.py -q
          uv run --locked --python 3.13.15 pytest offline_tests -q -k acquisition
          uv run --locked --python 3.13.15 python scripts/acquisition_contracts.py --check
          uv run --locked --python 3.13.15 python scripts/acquisition_recipient_contracts.py --check
          uv run --locked --python 3.13.15 python scripts/acquisition_retirement_contracts.py --check
          uv run --locked --python 3.13.15 python scripts/acquisition_projection_contracts.py --check
