xt x="332" y="803" fill="#e9edef" font-size="29" font-weight="400" font-family="Arial, sans-serif">Sounds good, Alex.</text><text x="579" y="839" fill="#adc1c5" font-size="20" font-weight="400" font-family="Arial, sans-serif">10:18</text><path d="m642 833 8 8 16-19m-10 19 16-19" fill="none" stroke="#65c3e0" stroke-width="3"/><rect x="20" y="1396" width="588" height="73" rx="37" fill="#202c33" stroke="none"/><svg x="38" y="1415" width="33" height="33" viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 1-20 0a10 10 0 0 1 20 0M7 15q5 6 10 0M8 8h.1M16 8h.1" stroke="#a8b7bf" stroke-width="1.65" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><text x="94" y="1444" fill="#95a6af" font-size="29" font-weight="400" font-family="Arial, sans-serif">Message</text><svg x="513" y="1417" width="29" height="29" viewBox="0 0 24 24"><path d="m9 15 8-8q5-4 5 2l-10 11q-7 6-9-1-1-3 3-6l10-10" stroke="#a8b7bf" stroke-width="1.65" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><circle cx="659" cy="1433" r="38" fill="#00a884" stroke="none"/><svg x="640" y="1413" width="37" height="37" viewBox="0 0 24 24"><path d="M9 3q3-4 6 0v9q-3 5-6 0ZM6 10v2q0 7 6 7t6-7v-2M12 19v4M8 23h8" stroke="#fff" stroke-width="1.65" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><rect x="0" y="1496" width="720" height="84" rx="0" fill="#030607" stroke="none"/><path d="m202 1538 23-15v30Z" fill="#d5dfe4"/><circle cx="360" cy="1538" r="13" fill="none" stroke="#d5dfe4"/><rect x="501" y="1526" width="24" height="24" rx="3" fill="#d5dfe4" stroke="none"/></svg>