<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex publikavimo bandymas</title><style>*{box-sizing:border-box}body{background:#f4f5f8;color:#172233;font:16px/1.6 system-ui;margin:0}main{max-width:760px;padding:28px;margin:auto}h1{font-size:26px;line-height:1.25}section,article{background:#fff;border:1px solid #d9e0ea;border-radius:12px;padding:22px;margin:20px 0}label{display:block;margin:15px 0}textarea,select,button{font:inherit;padding:10px;border:1px solid #aebacd;border-radius:7px;max-width:100%}textarea{width:100%;min-height:180px}button{background:#214f93;color:#fff;cursor:pointer}:focus-visible{outline:3px solid #6993d2;outline-offset:3px}button:disabled{opacity:.6}.body{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#214f93}#status{min-height:28px}@media(max-width:600px){main{padding:16px}}</style></head><body><main><h1>Codex publikavimo bandymas</h1><p>Izoliuota vietinė aplinka. Ši forma nieko neskelbia Facebook.</p><section><label>Publikuoti kaip<select id="actor"><option value="page">Bandomoji Page</option><option value="profile">Bandomasis profilis</option></select></label><p id="identity"></p><label>Įrašo tekstas<textarea id="body"></textarea></label><label>Bandymo auditorija<select id="audience"><option value="public">Viešai · tik bandymas</option><option value="only_me">Tik man · tik bandymas</option><option value="friends">Draugams · tik bandymas</option></select></label><button id="publish">Skelbti bandymo įrašą</button><p id="status" role="status" aria-live="polite"></p></section><div id="posts"></div></main><script>
const el=id=>document.getElementById(id);const original=location.pathname.split('/').at(-2);el('actor').value=original;el('audience').value=original==='page'?'public':'only_me';const ids={page:'fixture-page',profile:'fixture-profile'},names={page:'Bandomoji Page',profile:'Bandomasis profilis'};function identity(){el('identity').textContent='Aktyvus autorius: '+names[el('actor').value]+' · ID: '+ids[el('actor').value]}identity();el('actor').onchange=identity;
el('publish').onclick=async()=>{el('publish').disabled=true;el('status').textContent='Tikrinamas paskelbimas…';try{const r=await fetch(location.pathname,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({actor_kind:el('actor').value,actor_id:ids[el('actor').value],body:el('body').value,audience:el('audience').value})});const v=await r.json();if(!r.ok)throw Error(v.detail||'Nepavyko');const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),link=document.createElement('a');h.textContent=names[v.actor_kind];p.textContent=v.body;p.className='body';link.href=v.permalink;link.textContent='Įrašo nuoroda · '+v.id;a.append(h,p,link);el('posts').prepend(a);el('status').textContent='Bandymo įrašas paskelbtas · ID: '+v.id;el('body').value=''}catch(e){el('status').textContent=e.message}finally{el('publish').disabled=false}};
</script></body></html>
